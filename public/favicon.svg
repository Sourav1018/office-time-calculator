<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Glass Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e15" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Neon Lime Accent Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" />

  <!-- Inner Ambient Glow Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#limeGrad)" stroke-width="4" opacity="0.5" filter="url(#neonGlow)" />

  <!-- Clock Gauge Background Track -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="24" />

  <!-- Neon Progress Arc (Starts top 12 o'clock, 270° clockwise) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#limeGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="235" transform="rotate(-90 256 256)" filter="url(#neonGlow)" />

  <!-- Outer Radar Tick Marks Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(163, 230, 53, 0.4)" stroke-width="3.5" stroke-dasharray="6 14" />

  <!-- Leading Orbital Particle Head at 6 o'clock -->
  <circle cx="256" cy="406" r="18" fill="#a3e635" opacity="0.6" filter="url(#neonGlow)" />
  <circle cx="256" cy="406" r="14" fill="#a3e635" />
  <circle cx="256" cy="406" r="7" fill="#ffffff" />

  <!-- Center Clock Hands (Pointing to 5:00 Checkout Hour) -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Upwards Hand (12 o'clock) -->
    <line x1="256" y1="256" x2="256" y2="155" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <!-- Checkout Target Hand (5 o'clock) -->
    <line x1="256" y1="256" x2="335" y2="302" stroke="url(#limeGrad)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Central Pivot Dot -->
    <circle cx="256" cy="256" r="18" fill="#a3e635" stroke="#ffffff" stroke-width="5" />
  </g>

  <!-- Accent Status Indicator -->
  <circle cx="110" cy="110" r="8" fill="#a3e635" />
</svg>
